[dependencies]
openssl = ">=3, <3.6"
tqdm = "*"
libstdcxx-ng = ">=3.4,<15.0"
h5py = "*"
sortedcontainers = "*"
appdirs = "*"
graphviz = "*"
onnx = ">=1.14,<1.20"
packaging = "*"
torchvision = "*"
pip = "*"
python-graphviz = "*"
libstdcxx = ">=3.4,<15.0"
scikit-learn = "*"
pytorch = "==2.8.0"
uv = ">=0.4"
numpy = "*"
scipy = "*"

    [dependencies.python]
    channel = "conda-forge"
    build = "*cp*"
    version = "3.11.*, >=3.10,!=3.14.0,!=3.14.1,<4"

[project]
name = ".CondaPkg"
platforms = ["linux-64"]
channels = ["conda-forge", "pytorch"]
channel-priority = "strict"
description = "automatically generated by CondaPkg.jl"

[pypi-dependencies]
onnx-graphsurgeon = "*"

    [pypi-dependencies.onnx2pytorch]
    rev = "gelu-support"
    git = "https://github.com/phK3/onnx2pytorch.git"
